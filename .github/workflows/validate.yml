name: Validate BRIOFRAME public release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public site
        run: python tests/validate_site.py
      - name: Validate template inventory
        run: python tests/validate_inventory.py
      - name: Validate Phase 3 premium experience
        run: python tests/validate_phase3.py
      - name: Check library JavaScript syntax
        run: node --check assets/js/library.js
      - name: Check template detail JavaScript syntax
        run: node --check assets/js/template-detail.js
      - name: Check Phase 3 motion JavaScript syntax
        run: node --check assets/js/phase3-motion.js
      - name: Check demo runtime JavaScript syntax
        run: node --check assets/js/demo-runtime.js
      - name: Check JSON syntax
        run: python -m json.tool data/templates.json >/dev/null && python -m json.tool data/demo-config.json >/dev/null && python -m json.tool data/taxonomy.json >/dev/null
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start static preview server
        run: python -m http.server 4173 --bind 127.0.0.1 >/tmp/brioframe-http.log 2>&1 &
      - name: Run Phase 3 browser regression
        run: npx playwright test tests/phase3-browser.spec.js --workers=1
